name: 🧬 Nova Análise de Primers
description: Submeta seus primers para validação in silico no pipeline
title: "[Análise] - "
labels: ["analise-pendente"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🧬 Pipeline de Validação de Primers
        Preencha os campos abaixo com os parâmetros da sua simulação de PCR.
        O relatório será gerado automaticamente e um link será enviado por e-mail.

        ---
        ### 👤 Identificação

  - type: input
    id: nome
    attributes:
      label: Nome do Pesquisador
      placeholder: "Ex: Maria Silva"
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: E-mail para Notificação
      placeholder: "Ex: email@exemplo.com"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🧪 Sequências dos Primers

  - type: input
    id: primer_pair_name
    attributes:
      label: Nome do Par de Primers
      description: "Um nome/apelido para identificar este par de primers nos resultados (Ex: 18S_Euk_1391F-1510R)"
      placeholder: "Ex: 18S_Euk_1391F-1510R"
    validations:
      required: false

  - type: input
    id: primer_fwd
    attributes:
      label: "Primer Forward (5' → 3')"
      placeholder: "Ex: CCAGCASCYGCGGTAATTCC"
    validations:
      required: true

  - type: input
    id: primer_rev
    attributes:
      label: "Primer Reverse (5' → 3')"
      placeholder: "Ex: RCCACAAGCYARTTATCC"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🎯 Alvo da Análise

  - type: input
    id: regiao_alvo
    attributes:
      label: Região Alvo
      description: "Região do genoma que o par de primers amplifica. Escreva livremente (ex.: 18S, 16S, ITS, 18S-ITS-28S, COI)."
      placeholder: "Ex.: 18S-ITS-28S"
    validations:
      required: true

  - type: dropdown
    id: banco_dados
    attributes:
      label: Banco de Dados
      description: "Selecione contra qual banco genômico o BLAST será rodado. Refseqsoil é o banco completo (todos os grupos); Eucariotos é o Refseqsoil sem Bacteria/Archaea, útil pra marcadores como 18S/ITS/28S que não existem em procariontes; Procariotos é Bacteria + Archaea, para marcadores como 16S; Sar = Stramenopila/Alveolata/Rhizaria."
      options:
        - "Refseqsoil (banco completo: todos os grupos, inclui bactérias e arqueias)"
        - "Eucariotos (todos os eucariotos, sem bactérias e arqueias)"
        - "Procariotos (Bacteria + Archaea, para 16S)"
        - "Protozoa (Amoebozoa + Sar + Discoba + Metamonada)"
        - "Fungi (todos os filos de fungos)"
        - "Minhocas (Oligochaeta + Enchytraeidae)"
        - "Amoebozoa"
        - "Sar"
        - "Discoba"
        - "Metamonada"
        - "Basidiomycota"
        - "Ascomycota"
        - "Mucoromycota"
        - "Chytridiomycota"
        - "Zoopagomycota"
        - "Glomeromycota"
        - "Bacteria"
        - "Archaea"
        - "Nematoda"
        - "Tardigrada"
        - "Rotifera"
        - "Acari"
        - "Collembola"
        - "Formigas"
        - "Cupins"
        - "Isopodes"
        - "Miriapodes"
        - "Platelmintos"
        - "Coleoptera (besouros)"
        - "Gastropoda (caracóis e lesmas)"
        - "Apoidea (abelhas)"
        - "Araneae (aranhas)"
        - "Scorpiones (escorpiões)"
        - "Pseudoscorpiones (pseudoescorpiões)"
        - "Enchytraeidae"
    validations:
      required: true

  - type: dropdown
    id: tipo_organismo
    attributes:
      label: Tipo de organismo
      options:
        - "Geral (todos os reinos)"
        - "Eukaryota"
        - "Bactérias"
        - "Arqueias"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### ⚙️ Parâmetros do BLAST

  - type: input
    id: max_mismatches
    attributes:
      label: "Máximo de Mismatches (Extremidade 3')"
      placeholder: "Valores de 0 a 5"
    validations:
      required: true

  - type: input
    id: amp_min
    attributes:
      label: Tamanho Mínimo do Amplicon (bp)
    validations:
      required: true

  - type: input
    id: amp_max
    attributes:
      label: Tamanho Máximo do Amplicon (bp)
    validations:
      required: true

  - type: input
    id: tm_min
    attributes:
      label: Temperatura de Melting mínima (Tm)
      value: "0"
    validations:
      required: true

  - type: input
    id: evalue
    attributes:
      label: E-value Máximo
    validations:
      required: true

  - type: input
    id: cobertura
    attributes:
      label: Cobertura mínima (%)
      placeholder: "De 0 a 100"
    validations:
      required: true

  - type: input
    id: max_hits
    attributes:
      label: Limite de hits
    validations:
      required: true

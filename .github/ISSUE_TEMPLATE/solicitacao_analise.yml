name: 🧬 New Primer Analysis
description: Submit your primers for in silico validation in the pipeline
title: "[Analysis] - "
labels: ["analise-pendente"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🧬 Primer Validation Pipeline
        Fill in the fields below with the parameters of your *in silico* PCR simulation.
        Once processing is complete, you will receive the results of your analysis by e-mail, and your primer pair will be automatically added to the collection of evaluated primers on the TerraSeq home page.

        ---
        ### 👤 Identification

  - type: input
    id: nome
    attributes:
      label: Researcher Name
      placeholder: "e.g. Maria Silva"
    validations:
      required: true

  - type: input
    id: email
    attributes:
      label: Notification E-mail
      placeholder: "e.g. email@example.com"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🧪 Primer Sequences

  - type: input
    id: primer_pair_name
    attributes:
      label: Primer Pair Name
      description: "A name to identify this primer pair in the results (e.g. 18S_Euk_1391F-1510R)"
      placeholder: "e.g. 18S_Euk_1391F-1510R"
    validations:
      required: false

  - type: input
    id: primer_fwd
    attributes:
      label: "Forward Primer (5' → 3')"
      placeholder: "e.g. CCAGCASCYGCGGTAATTCC"
    validations:
      required: true

  - type: input
    id: primer_rev
    attributes:
      label: "Reverse Primer (5' → 3')"
      placeholder: "e.g. RCCACAAGCYARTTATCC"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### 🎯 Analysis Target

  - type: input
    id: regiao_alvo
    attributes:
      label: Target Region
      description: "Genome region amplified by the primer pair. Free text (e.g. 18S, 16S, ITS, 18S-ITS-28S, COI)."
      placeholder: "e.g. 18S-ITS-28S"
    validations:
      required: true

  - type: dropdown
    id: banco_dados
    attributes:
      label: Database
      description: "Select the genome database BLAST will search. Refseqsoil is the complete database (all groups); Eukaryotes is Refseqsoil without Bacteria/Archaea, useful for markers such as 18S/ITS/28S that prokaryotes lack; Prokaryotes is Bacteria + Archaea, for markers such as 16S; Sar = Stramenopila/Alveolata/Rhizaria."
      options:
        - "Refseqsoil (complete database: all groups, including bacteria and archaea)"
        - "Eukaryotes (all eukaryotes, without bacteria and archaea)"
        - "Prokaryotes (Bacteria + Archaea, for 16S)"
        - "Protozoa (Amoebozoa + Sar + Discoba + Metamonada)"
        - "Fungi (all fungal phyla)"
        - "Earthworms (Oligochaeta + Enchytraeidae)"
        - "Amoebozoa"
        - "Sar"
        - "Discoba"
        - "Metamonada"
        - "Basidiomycota"
        - "Ascomycota"
        - "Mucoromycota"
        - "Chytridiomycota"
        - "Zoopagomycota"
        - "Glomeromycota"
        - "Bacteria"
        - "Archaea"
        - "Nematoda"
        - "Tardigrada"
        - "Rotifera"
        - "Acari"
        - "Collembola"
        - "Ants"
        - "Termites"
        - "Isopods"
        - "Myriapods"
        - "Flatworms"
        - "Coleoptera (beetles)"
        - "Gastropoda (snails and slugs)"
        - "Apoidea (bees)"
        - "Araneae (spiders)"
        - "Scorpiones (scorpions)"
        - "Pseudoscorpiones (pseudoscorpions)"
        - "Enchytraeidae"
    validations:
      required: true

  - type: dropdown
    id: tipo_organismo
    attributes:
      label: Organism Type
      options:
        - "General (all kingdoms)"
        - "Eukaryota"
        - "Bacteria"
        - "Archaea"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ### ⚙️ BLAST Parameters

  - type: input
    id: max_mismatches
    attributes:
      label: "Maximum 3' End Mismatches"
      placeholder: "Values from 0 to 5"
    validations:
      required: true

  - type: input
    id: amp_min
    attributes:
      label: Minimum Amplicon Size (bp)
    validations:
      required: true

  - type: input
    id: amp_max
    attributes:
      label: Maximum Amplicon Size (bp)
    validations:
      required: true

  - type: input
    id: tm_min
    attributes:
      label: Minimum Melting Temperature (Tm)
      value: "0"
    validations:
      required: true

  - type: input
    id: evalue
    attributes:
      label: Maximum E-value
    validations:
      required: true

  - type: input
    id: cobertura
    attributes:
      label: Minimum Coverage (%)
      placeholder: "From 0 to 100"
    validations:
      required: true
